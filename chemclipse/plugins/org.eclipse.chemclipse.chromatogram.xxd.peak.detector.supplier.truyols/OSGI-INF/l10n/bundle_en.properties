#Properties file
Truyols=Vivó-Truyols
TruyolsDescription=Derivative-based peak detector (1st/2nd/3rd derivative), after Vivó-Truyols et al., J. Chromatogr. A 1096 (2005) 133-145.
WindowSize=Window Size
WindowSizeDescription=Savitzky-Golay window size (odd, 5-45).
PolynomialOrder=Polynomial Order
PolynomialOrderDescription=Savitzky-Golay polynomial degree (2-5). The paper uses 2.
NoiseFactor=Noise Factor
NoiseFactorDescription=Multiplier applied to the derivative noise estimate to form the detection threshold (paper: ~5).
MinSignalToNoiseRatio=Min S/N Ratio
FilterMode=Filter Mode
FilterMasses=m/z values to filter
UseIndividualTraces=Use Individual Traces
UseIndividualTracesDescription=Uses each ion in the filter list individually to detect peaks.
FilterWavelengths=Wavelengths to filter
UseIndividualWavelengths=Use Individual Wavelengths
UseIndividualWavelengthsDescription=Uses each wavelength in the filter list individually to detect peaks.
PeaksDetected={0} peaks have been detected.
